services:
  mysql:
    image: mysql:8.4
    container_name: meetmate-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: meetmate
      MYSQL_USER: meetmate
      MYSQL_PASSWORD: meetmate
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-local-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-local-data: